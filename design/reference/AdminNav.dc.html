<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:232px;flex:0 0 232px;display:flex;flex-direction:column;gap:20px;padding:16px 12px;background:var(--neutral-background-weak);border-right:1px solid var(--neutral-border-weak)">
  <div style="display:flex;align-items:center;gap:10px;padding:4px 8px">
    <div style="width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--brand-solid-strong);color:#fff;display:flex;align-items:center;justify-content:center;font:700 11px/1 Geist,sans-serif;letter-spacing:.02em">AB</div>
    <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
      <span style="font:600 12px/1.2 Geist,sans-serif;letter-spacing:.04em;color:var(--neutral-on-background-strong)">ASOBARCELONA</span>
      <span style="font:400 11px/1.2 Geist,sans-serif;color:var(--neutral-on-background-weak)">Junta de condominio</span>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px">
    <sc-for list="{{ grupos }}" as="g" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font:500 10px/1 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--neutral-on-background-weak);padding:0 10px 6px">{{ g.titulo }}</span>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2">
          <div style="{{ it.estilo }}">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ it.d }}"></path></svg>
            <span style="font:500 13px/1 Geist,sans-serif">{{ it.label }}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;color:var(--neutral-on-background-medium)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M12 3v2M12 19v2M4.2 7.5l1.7 1M18.1 15.5l1.7 1M4.2 16.5l1.7-1M18.1 8.5l1.7-1"></path></svg>
      <span style="font:500 13px/1 Geist,sans-serif">Configuración</span>
    </div>
    <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--neutral-alpha-weak)">
      <div style="width:26px;height:26px;border-radius:99px;background:var(--accent-background-weak);color:var(--accent-on-background-strong);display:flex;align-items:center;justify-content:center;font:600 10px/1 Geist,sans-serif">GB</div>
      <div style="display:flex;flex-direction:column;min-width:0">
        <span style="font:500 12px/1.3 Geist,sans-serif;color:var(--neutral-on-background-strong)">Gladys B.</span>
        <span style="font:400 10px/1.3 Geist,sans-serif;color:var(--neutral-on-background-weak);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Administradora</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;panel&quot;,&quot;casas&quot;,&quot;cuotas&quot;,&quot;pago&quot;,&quot;reporte&quot;,&quot;historial&quot;],&quot;default&quot;:&quot;panel&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const activo = this.props.activo ?? "panel";
    const base = "display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:8px;";
    const on = base + "background:var(--brand-background-weak);color:var(--brand-on-background-strong);box-shadow:inset 0 0 0 1px var(--brand-border-medium)";
    const off = base + "color:var(--neutral-on-background-medium)";
    const mk = (key, label, d) => ({ key, label, d, estilo: key === activo ? on : off });
    return {
      grupos: [
        { titulo: "General", items: [
          mk("panel", "Panel", "M3 10.6 12 3.5l9 7.1V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"),
          mk("casas", "Casas y vecinos", "M3 21h18M6 21V9l6-4 6 4v12M10 21v-5h4v5"),
        ]},
        { titulo: "Cobranza", items: [
          mk("cuotas", "Cuotas", "M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"),
          mk("pago", "Registrar pago", "M2.5 7.5h19v9h-19zM2.5 11h19M6 14h3"),
        ]},
        { titulo: "Reportes", items: [
          mk("reporte", "Reporte mensual", "M4 20V11M10 20V4M16 20v-6M21.5 20h-19"),
          mk("historial", "Historial por casa", "M12 7.5V12l3 1.8M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"),
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
